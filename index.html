<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>three.ez example</title>
  <style>
    html,
    body {
      font-family: monospace;
      font-size: 0.9rem;
      color: white;
      height: 100%;
      margin: 0;
      overflow: hidden;
      overscroll-behavior: none;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
      user-select: none;
    }

    #loading {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: black;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    #progress-container {
      width: auto;
      height: 1px;
      background: #333;
      position: relative;
    }

    #progress-bar {
      height: 100%;
      background: white;
      width: 0%;
      transition: width 0.3s ease;
      margin-top: 8px;
    }

    #loading-caption {
      font-size: 0.75rem;
      color: #aaa;
      opacity: 0.7;
      margin-top: 30px;
    }

    .info {
      position: fixed;
      top: 50px;
      left: 5px;
    }

    a {
      color: white;
    }
  </style>
</head>

<body>
  <div id="loading">
    <script src="https://unpkg.com/@lottiefiles/dotlottie-wc@0.8.5/dist/dotlottie-wc.js" type="module"></script>
    <dotlottie-wc src="https://lottie.host/5894ffa7-5e00-40e2-8e37-8cd4f9db2a44/uMtmlXeKNz.lottie"
      style="width: 75px;height: 75px" autoplay loop></dotlottie-wc>
    <div id="loading-caption">Loading Octahedral Impostor…
      <div id="progress-container">
        <div id="progress-bar"></div>
      </div>
    </div>
  </div>
  <span id="info" class="info" style="display: none">
    Trees are rendered as octahedral impostors when far away. <br>
    ⭐ If you like this example please leave a star on the
    <a href="https://github.com/agargaro/octahedral-impostor">github repository</a>.
  </span>
  <script type="module" src="./examples/showcase2/world.ts"></script>
</body>

</html>
